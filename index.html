<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style/style.css">
</head>

<body>

  <!-- Intestazione con titolo e barra di ricerca -->
  <header class="site-header text-white py-4 px-3">
    <div class="container text-center">
      <h1 class="fw-bold mb-1">SportsHub</h1>
      <p class="mb-3">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

      <form id="search-form" class="row g-2 justify-content-center">
        <div class="col-12 col-sm-7 col-md-5">
          <input id="search-input" type="text" class="form-control" placeholder="Es. Arsenal, Inter, Lakers...">
        </div>
        <div class="col-12 col-sm-auto">
          <button id="search-btn" type="submit" class="btn btn-light fw-semibold px-4 w-100">Cerca</button>
        </div>
      </form>
    </div>
  </header>

  <main class="container py-4">

    <!-- Messaggi di caricamento ed errore -->
    <div id="feedback-area" class="mb-3"></div>

    <!-- Filtro per sport della versione avanzata -->
    <section id="filtro-section" class="mb-4">
      <div class="d-flex flex-wrap align-items-center gap-2" id="sport-filters">
        <span class="fw-semibold small text-secondary me-1">Sport:</span>
        <button type="button" class="btn btn-sm btn-sport active" data-sport="ALL">Tutti</button>
        <button type="button" class="btn btn-sm btn-sport" data-sport="Soccer">Calcio</button>
        <button type="button" class="btn btn-sm btn-sport" data-sport="Basketball">Basket</button>
        <button type="button" class="btn btn-sm btn-sport" data-sport="American Football">Football</button>
      </div>
    </section>

    <!-- Sezione squadre preferite salvate in localStorage -->
    <section id="preferiti-section" class="mb-5">
      <h2 class="h4 fw-bold mb-3">Le tue squadre preferite</h2>
      <div id="preferiti-list" class="row g-3"></div>
    </section>

    <!-- Sezione risultati ricerca e dettagli eventi -->
    <section id="risultati-section">
      <h2 class="h4 fw-bold mb-3">Squadre trovate</h2>
      <div id="risultati-list" class="row g-3 mb-4"></div>

      <div id="dettagli-section" class="card border-0 shadow-sm p-4 d-none">
        <h3 id="dettagli-titolo" class="h5 fw-bold mb-3"></h3>
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <h4 class="h6 fw-bold pb-2 border-bottom border-2">Prossimi eventi</h4>
            <div id="prossimi-eventi-list"></div>
          </div>
          <div class="col-12 col-md-6">
            <h4 class="h6 fw-bold pb-2 border-bottom border-2">Ultimi risultati</h4>
            <div id="ultimi-eventi-list"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modale Bootstrap per i dettagli dell'evento -->
  <div class="modal fade" id="eventoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header site-header text-white">
          <h5 id="modal-evento-titolo" class="modal-title fw-bold">Dettagli evento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div id="modal-evento-corpo" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/script/script.js"></script>
</body>

</html>
